name: Mac

# The Mac suite, started by hand on a chosen branch from the Actions page or
# with:
#
#   gh workflow run mac.yml --ref <branch>
#
# It runs build and test on macOS on Apple silicon, and the smoke test and
# the real update on macOS on Apple silicon and on Intel, whatever the branch
# changes. The jobs are defined in go.yml, which CI calls on Linux.
# CONTRIBUTING.md, under "Continuous integration", says when to run it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    uses: ./.github/workflows/go.yml
    with:
      runner: macos-latest
      test: true

  real:
    name: Smoke test and real update
    strategy:
      fail-fast: false
      matrix:
        # macOS on Apple silicon (macos-latest) and macOS on Intel
        # (macos-15-intel).
        os: [macos-latest, macos-15-intel]
    uses: ./.github/workflows/go.yml
    with:
      runner: ${{ matrix.os }}
      real: true
      update: true
