name: CI

# Which job runs when is set out in CONTRIBUTING.md, under "Continuous
# integration". Build and test on Linux runs for every change. Every job
# that runs on a Mac, downloads real software or builds the release runs
# only when the paths it tests have changed; the changes job decides.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      skyclient: ${{ steps.filter.outputs.skyclient }}
      tsh: ${{ steps.filter.outputs.tsh }}
      test_os: ${{ steps.filter.outputs.test_os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Check the changed paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # On a pull request, the change is the pull request's diff; on a
          # push, the commits the push added. When that cannot be worked
          # out, such as for the first push of a branch, everything runs.
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "$PR_BASE...$PR_HEAD")
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
              && changed=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER" 2>/dev/null); then
            :
          else
            changed=".github/workflows/ci.yml"
          fi
          echo "Changed paths:"
          echo "$changed"

          matches() { echo "$changed" | grep -qE "$1"; }
          workflow='^\.github/workflows/ci\.yml$'
          code=false skyclient=false tsh=false
          if matches "\.go\$|^go\.(mod|sum)\$|^internal/|^install\.sh\$|^\.goreleaser\.yaml\$|$workflow"; then
            code=true
          fi
          if matches "^internal/skyclient/|$workflow"; then skyclient=true; fi
          if matches "^internal/tsh/|$workflow"; then tsh=true; fi
          if [ "$code" = true ]; then
            test_os='["ubuntu-latest","macos-latest"]'
          else
            test_os='["ubuntu-latest"]'
          fi
          {
            echo "code=$code"
            echo "skyclient=$skyclient"
            echo "tsh=$tsh"
            echo "test_os=$test_os"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Build and test (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.test_os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  shellcheck:
    name: Check install.sh with shellcheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck install.sh

  goreleaser-snapshot:
    name: Build the release archives in snapshot mode
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: Check the archives, checksums and install.sh
        run: |
          missing=0
          for platform in darwin_arm64 darwin_amd64 linux_amd64; do
            if ! ls dist/axon_*_"$platform".tar.gz >/dev/null 2>&1; then
              echo "No archive for $platform"
              missing=1
            fi
          done
          if [ ! -f dist/checksums.txt ]; then
            echo "No checksums.txt"
            missing=1
          fi
          # A snapshot build does not copy the release's extra files into
          # dist/; they are attached only when a release is published. So
          # check that the configuration GoReleaser resolved attaches
          # install.sh, and that the file exists to be attached.
          if ! grep -Eq '^[[:space:]]+- glob: install\.sh$' dist/config.yaml; then
            echo "The release does not attach install.sh"
            missing=1
          fi
          if [ ! -f install.sh ]; then
            echo "No install.sh at the repository root"
            missing=1
          fi
          if ls dist/*windows* >/dev/null 2>&1; then
            echo "A Windows archive was built"
            missing=1
          fi
          ls dist
          exit "$missing"

  real:
    name: Real installs and smoke test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # One runner per platform the release is built for: Linux on
        # x86-64, macOS on Apple silicon (macos-latest) and macOS on Intel
        # (macos-15-intel).
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      AXON_REAL_INSTALL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install the SkyPilot client into an empty home and run sky --version
        if: needs.changes.outputs.skyclient == 'true'
        run: go test -count=1 -timeout 20m -run '^TestRealInstall$' -v ./internal/skyclient
      - name: Run axon login with an example organisation file in an empty home
        run: go test -count=1 -timeout 20m -run '^TestSmokeLogin$' -v .
      - name: Install tsh into an empty home and run tsh version
        if: needs.changes.outputs.tsh == 'true'
        run: go test -count=1 -timeout 20m -run '^TestRealInstall$' -v ./internal/tsh
