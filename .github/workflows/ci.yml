name: CI

# Which job runs when is set out in CONTRIBUTING.md, under "Continuous
# integration". Every job here runs on Linux. Build and test runs for every
# change; every job that downloads real software or builds the release runs
# only when the paths it tests have changed, and the changes job decides.
# Build and test and the real job are defined in go.yml, which the Mac
# workflow, started by hand, calls as well. The Mac jobs also run in the
# release workflow, before a release is published.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      update: ${{ steps.filter.outputs.update }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        name: Check the changed paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # On a pull request, the change is the pull request's diff; on a
          # push, the commits the push added. When that cannot be worked
          # out, such as for the first push of a branch or a commit a
          # force-push removed, everything runs. Paths are printed as they
          # are, not quoted, so that a name with non-ASCII characters still
          # matches the patterns below.
          changed_paths() { git -c core.quotePath=false diff --name-only --no-renames "$@" 2>/dev/null; }
          if [ "$EVENT" = "pull_request" ] && changed=$(changed_paths "$PR_BASE...$PR_HEAD"); then
            :
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] \
              && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
              && changed=$(changed_paths "$PUSH_BEFORE" "$PUSH_AFTER"); then
            :
          else
            changed=".github/workflows/ci.yml"
          fi
          echo "Changed paths:"
          echo "$changed"

          matches() { echo "$changed" | grep -qE "$1"; }
          workflow='^\.github/workflows/(ci|go)\.yml$'
          code=false update=false
          if matches "\.go\$|^go\.(mod|sum)\$|^internal/|^install\.sh\$|^\.goreleaser\.yaml\$|^\.github/release-gate/|^\.github/workflows/release\.yml\$|$workflow"; then
            code=true
          fi
          if matches "^internal/update/|^update_test\.go\$|$workflow"; then update=true; fi
          {
            echo "code=$code"
            echo "update=$update"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Build and test
    uses: ./.github/workflows/go.yml
    with:
      runner: ubuntu-latest
      test: true

  shellcheck:
    name: Check install.sh and the release gate's curl with shellcheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck install.sh .github/release-gate/curl

  goreleaser-snapshot:
    name: Build the release archives in snapshot mode
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "v2.20.3"
          args: release --snapshot --clean
      - name: Check the archives, checksums and install.sh
        run: |
          missing=0
          for platform in darwin_arm64 darwin_amd64 linux_amd64; do
            if ! ls dist/axon_*_"$platform".tar.gz >/dev/null 2>&1; then
              echo "No archive for $platform"
              missing=1
            fi
          done
          if [ ! -f dist/checksums.txt ]; then
            echo "No checksums.txt"
            missing=1
          fi
          # A snapshot build does not copy the release's extra files into
          # dist/; they are attached only when a release is published. So
          # check that the configuration GoReleaser resolved attaches
          # install.sh, and that the file exists to be attached.
          if ! grep -Eq '^[[:space:]]+- glob: install\.sh$' dist/config.yaml; then
            echo "The release does not attach install.sh"
            missing=1
          fi
          if [ ! -f install.sh ]; then
            echo "No install.sh at the repository root"
            missing=1
          fi
          if ls dist/*windows* >/dev/null 2>&1; then
            echo "A Windows archive was built"
            missing=1
          fi
          ls dist
          exit "$missing"

  real:
    name: Smoke test and real update
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/go.yml
    with:
      runner: ubuntu-latest
      real: true
      update: ${{ needs.changes.outputs.update == 'true' }}
