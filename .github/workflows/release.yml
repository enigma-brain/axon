name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Publish the release with GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-install:
    name: Install the release and smoke-test it (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        # One runner per platform the release is built for: Linux on
        # x86-64, macOS on Apple silicon (macos-latest) and macOS on Intel
        # (macos-15-intel).
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Run the install line
        run: |
          # The unpinned line installs the latest release. GitHub never serves
          # a pre-release as the latest, and a newer release may have been
          # published since this tag, so unless this tag is the latest the
          # script of this tag's release is downloaded and told which version
          # to install.
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ "$latest" = "$TAG" ]; then
            curl -fsSL https://github.com/enigma-brain/axon/releases/latest/download/install.sh | sh
          else
            echo "$TAG is not the latest release; installing it by name"
            curl -fsSL -o install.sh "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh"
            AXON_VERSION="$TAG" sh install.sh
          fi
      - name: Check axon --version
        run: |
          want="axon ${TAG#v}"
          got=$("$HOME/.local/bin/axon" --version)
          echo "$got"
          if [ "$got" != "$want" ]; then
            echo "axon --version printed \"$got\", want \"$want\""
            exit 1
          fi
      # The release is already published when this runs, so a failure here
      # cannot withdraw it; it fails the workflow, and CONTRIBUTING.md says
      # what a maintainer does then.
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run the installed axon login with an example organisation file in an empty home
        env:
          AXON_REAL_INSTALL: "1"
        run: AXON_SMOKE_BIN="$HOME/.local/bin/axon" go test -count=1 -timeout 20m -run '^TestSmokeLogin$' -v .
