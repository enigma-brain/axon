name: Release

# A pushed tag v<version> is released in four steps:
#
#   1. draft:   GoReleaser builds the archives and checksums.txt and uploads
#               them, with install.sh, to a draft release, which nobody
#               without write access sees and the install line never serves.
#   2. gate:    on one runner per platform the release is built for, the
#               release's install.sh installs this tag's archive from the
#               same files, and axon --version and the smoke test run
#               against the installed binary.
#   3. publish: only when the gate passed on every platform, the draft is
#               published.
#   4. check:   the install line runs against the published release.
#
# When the gate fails, the release stays a draft and the workflow fails.
# CONTRIBUTING.md, under "Continuous integration", says what a maintainer
# does then.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  draft:
    name: Build the release as a draft with GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect the files uploaded to the draft
        run: |
          mkdir release-files
          cp dist/axon_*.tar.gz dist/checksums.txt install.sh release-files/
          ls -l release-files
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: release-files/
          if-no-files-found: error

  gate:
    name: Install the draft and smoke-test it (${{ matrix.os }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        # One runner per platform the release is built for: Linux on
        # x86-64, macOS on Apple silicon (macos-latest) and macOS on Intel
        # (macos-15-intel).
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files
      - name: Run the release's install.sh against the draft's files
        env:
          GATE_DIR: ${{ runner.temp }}/release-files
          GATE_REPO: ${{ github.repository }}
          GATE_TAG: ${{ github.ref_name }}
        run: |
          # A draft's files cannot be downloaded without a token, so a curl
          # that serves them from the workflow artifact, and fails for any
          # other address, comes first on PATH. install.sh itself runs
          # unchanged.
          PATH="$GITHUB_WORKSPACE/.github/release-gate:$PATH" \
            AXON_VERSION="$TAG" sh "$GATE_DIR/install.sh"
      - name: Check axon --version
        run: |
          want="axon ${TAG#v}"
          got=$("$HOME/.local/bin/axon" --version)
          echo "$got"
          if [ "$got" != "$want" ]; then
            echo "axon --version printed \"$got\", want \"$want\""
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run the installed axon login with an example organisation file in an empty home
        env:
          AXON_REAL_INSTALL: "1"
        run: AXON_SMOKE_BIN="$HOME/.local/bin/axon" go test -count=1 -timeout 20m -run '^TestSmokeLogin$' -v .
      - name: Report that the release stays a draft
        if: failure()
        run: |
          echo "The gate failed on ${{ matrix.os }}, so release $TAG stays a draft and is not published." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish the release
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish the draft
        run: |
          # GitHub serves the release marked latest to the install line, so
          # the mark is set explicitly: a pre-release never takes it, and a
          # full release takes it unless a published full release has a
          # higher version.
          prerelease=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)
          latest=false
          if [ "$prerelease" = false ]; then
            highest=$({
              gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName'
              echo "$TAG"
            } | sed 's/^v//' | sort -V | tail -n 1)
            if [ "v$highest" = "$TAG" ]; then
              latest=true
            fi
          fi
          echo "Publishing $TAG: pre-release $prerelease, latest $latest"
          gh release edit "$TAG" --draft=false --latest="$latest"

  check:
    name: Run the install line against the published release
    needs: publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Run the install line
        run: |
          # The unpinned line installs the latest release. GitHub never serves
          # a pre-release as the latest, and a newer release may have been
          # published since this tag, so unless this tag is the latest the
          # script of this tag's release is downloaded and told which version
          # to install.
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ "$latest" = "$TAG" ]; then
            curl -fsSL https://github.com/enigma-brain/axon/releases/latest/download/install.sh | sh
          else
            echo "$TAG is not the latest release; installing it by name"
            curl -fsSL -o install.sh "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh"
            AXON_VERSION="$TAG" sh install.sh
          fi
      # The release is already published when this runs, so a failure here
      # cannot withdraw it; it fails the workflow, and CONTRIBUTING.md says
      # what a maintainer does then.
      - name: Check axon --version
        run: |
          want="axon ${TAG#v}"
          got=$("$HOME/.local/bin/axon" --version)
          echo "$got"
          if [ "$got" != "$want" ]; then
            echo "axon --version printed \"$got\", want \"$want\""
            exit 1
          fi
